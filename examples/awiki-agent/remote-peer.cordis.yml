# Read-only peer used by the remote acceptance runner to observe messages and
# download the attachment through an independently provisioned SDK state.
- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    agents: []
    persona: ''
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: never

- id: awiki
  name: '@deepseek-ai/dsh-awiki'
  config:
    userServiceUrl: !!js process.env.DSH_AWIKI_USER_SERVICE_URL
    userServiceDomain: !!js process.env.DSH_AWIKI_USER_SERVICE_DOMAIN
    messageServiceUrl: !!js process.env.DSH_AWIKI_MESSAGE_SERVICE_URL
    messageServicePublicUrl: !!js process.env.DSH_AWIKI_MESSAGE_SERVICE_PUBLIC_URL
    messageServiceDid: !!js process.env.DSH_AWIKI_MESSAGE_SERVICE_DID
    statePath: !!js process.env.DSH_AWIKI_PEER_STATE_PATH
    attachmentMaxBytes: 10485760

- id: awiki-provider
  name: '@deepseek-ai/dsh-awiki/provider'
