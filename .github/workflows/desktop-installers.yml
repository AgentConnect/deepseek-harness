name: Desktop installers

on:
  workflow_dispatch:
  pull_request:
    branches:
      - agent/awiki-mvp
    paths:
      - '.github/workflows/desktop-installers.yml'
      - 'apps/cli/**'
      - 'experiments/electron/**'
      - 'experiments/electron-runtime/**'
      - 'packages/boot/app-boot/**'
      - 'packages/host/apiproxy/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  push:
    branches:
      - agent/awiki-mvp
    paths:
      - '.github/workflows/desktop-installers.yml'
      - 'apps/cli/**'
      - 'experiments/electron/**'
      - 'experiments/electron-runtime/**'
      - 'packages/boot/app-boot/**'
      - 'packages/host/apiproxy/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            command: make:mac
            artifact: deepseek-harness-macos-arm64
            path: |
              h/experiments/electron/out/make/**/*.dmg
              h/experiments/electron/out/make/**/*.zip
          - runner: windows-latest
            command: make:windows
            artifact: deepseek-harness-windows-x64
            path: h/experiments/electron/out/make/**/*.exe
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: h
    steps:
      - uses: actions/checkout@v4
        with:
          path: h
      - uses: actions/checkout@v4
        with:
          repository: Howe829/AgentConnect
          ref: 37c7db11c18ec80319bf647a6deec8ef77c63bb5
          path: anp
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: h/pnpm-lock.yaml
      - name: Build the linked ANP TypeScript SDK
        working-directory: anp/typescript/ts_sdk
        run: npm ci && npm run build
      - run: pnpm install --frozen-lockfile
      - name: Import the Apple distribution certificate
        if: runner.os == 'macOS' && github.event_name == 'push'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          DSH_MACOS_SIGN_IDENTITY: ${{ secrets.DSH_MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          configured=0
          missing=0
          for name in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD DSH_MACOS_SIGN_IDENTITY APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -n "${!name}" ]]; then configured=1; else missing=1; fi
          done
          if [[ "$configured" == 0 ]]; then
            echo 'Apple distribution credentials are not configured; producing an unsigned validation artifact.'
            exit 0
          fi
          if [[ "$missing" == 1 ]]; then
            echo 'Apple distribution credentials are incomplete.' >&2
            exit 1
          fi
          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          keychain_path="$RUNNER_TEMP/deepseek-harness-signing.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          if ! security find-identity -v -p codesigning "$keychain_path" | grep -Fq "\"$DSH_MACOS_SIGN_IDENTITY\""; then
            echo 'Configured Developer ID Application identity was not imported into the temporary keychain.' >&2
            exit 1
          fi
          rm -f "$certificate_path"
          echo "DSH_MACOS_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
      - name: Make unsigned macOS validation installers
        if: runner.os == 'macOS' && github.event_name != 'push'
        run: pnpm --filter deepseek-harness-electron run ${{ matrix.command }}
      - name: Make macOS release installers
        if: runner.os == 'macOS' && github.event_name == 'push'
        env:
          DSH_MACOS_SIGN_IDENTITY: ${{ secrets.DSH_MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm --filter deepseek-harness-electron run ${{ matrix.command }}
      - name: Map a short Windows build path
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: 'subst W: $env:GITHUB_WORKSPACE'
      - name: Make Windows installer
        if: runner.os == 'Windows'
        working-directory: W:\h
        shell: pwsh
        run: pnpm --filter deepseek-harness-electron run ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
      - name: Remove the temporary Apple signing keychain
        if: always() && runner.os == 'macOS'
        run: |
          if [[ -n "${DSH_MACOS_KEYCHAIN:-}" ]]; then
            security delete-keychain "$DSH_MACOS_KEYCHAIN"
          fi
