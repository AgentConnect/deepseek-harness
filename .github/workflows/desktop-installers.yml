name: Desktop installers

on:
  workflow_dispatch:
  push:
    branches:
      - agent/awiki-electron-distribution
    paths:
      - '.github/workflows/desktop-installers.yml'
      - 'apps/cli/**'
      - 'experiments/electron/**'
      - 'experiments/electron-runtime/**'
      - 'packages/boot/app-boot/**'
      - 'packages/host/apiproxy/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            command: make:mac
            artifact: deepseek-harness-macos-arm64
            path: |
              deepseek-harness/experiments/electron/out/make/**/*.dmg
              deepseek-harness/experiments/electron/out/make/**/*.zip
          - runner: windows-latest
            command: make:windows
            artifact: deepseek-harness-windows-x64
            path: deepseek-harness/experiments/electron/out/make/**/*.exe
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: deepseek-harness
    steps:
      - uses: actions/checkout@v4
        with:
          path: deepseek-harness
      - uses: actions/checkout@v4
        with:
          repository: Howe829/AgentConnect
          ref: 37c7db11c18ec80319bf647a6deec8ef77c63bb5
          path: anp
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: deepseek-harness/pnpm-lock.yaml
      - name: Build the linked ANP TypeScript SDK
        working-directory: anp/typescript/ts_sdk
        run: npm ci && npm run build
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter deepseek-harness-electron run ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
